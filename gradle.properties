# The version of the application: the one place to change it for a release.
#   1. change the number below (and nothing else), commit and push
#   2. tag it: git tag v<number> && git push origin v<number>   (a hyphen after it, v0.2.0-rc1, makes a pre-release)
# The release workflow refuses a tag whose number differs from this one. Gradle uses this value as the project version, so it also
# names the jar (build/libs/FinancialDashboard-<version>.jar).
version=0.1.0
