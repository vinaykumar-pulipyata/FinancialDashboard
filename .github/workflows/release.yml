# Release: runs only when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# It tests the code once, then builds the native executable on each system (a GraalVM native image can only be built on the system it is
# for), runs the same smoke test on every one of them, and attaches the executables to a GitHub Release.
# A tag with a hyphen (v0.1.0-rc1) is published as a pre-release, so the whole run can be tried before the real one.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write            # create the release and upload the files to it

jobs:
  verify:
    name: Tests and jar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The version lives in gradle.properties. A tag v0.2.0 or v0.2.0-rc1 must be for the version in that file (0.2.0), so a release is never
      # made from a commit that still says another version.
      - name: Check the tag matches the version in gradle.properties
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          version="$(sed -n 's/^version *= *//p' gradle.properties | tr -d '[:space:]')"
          echo "tag $GITHUB_REF_NAME -> $tag ; gradle.properties version -> $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is for version $tag but gradle.properties says $version. Change gradle.properties, commit, and tag again."
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --stacktrace

  native:
    name: ${{ matrix.asset }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false       # one system failing should not sink the others
      matrix:
        include:
          - os: ubuntu-latest
            asset: financial-dashboard-linux-x64
            binary: build/native/nativeCompile/FinancialDashboard
          - os: ubuntu-24.04-arm
            asset: financial-dashboard-linux-arm64
            binary: build/native/nativeCompile/FinancialDashboard
          - os: macos-15              # Apple silicon; the Intel macOS runners are left out on purpose
            asset: financial-dashboard-macos-arm64
            binary: build/native/nativeCompile/FinancialDashboard
          - os: windows-latest
            asset: financial-dashboard-windows-x64.exe
            binary: build/native/nativeCompile/FinancialDashboard.exe

    steps:
      - uses: actions/checkout@v4

      # Windows only: the GraalVM Gradle plugin writes native-image's argument file into Java's temp folder (on C: on the runner) and then
      # writes its path relative to the build folder (on D:), which fails with "'other' has different root" across two drives. So Java's
      # temp folder goes inside the workspace too, for every JVM of the build.
      - name: Keep Java's temp folder on the same drive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ws="$(cygpath -m "$GITHUB_WORKSPACE")"
          mkdir -p "$ws/tmp"
          echo "JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=$ws/tmp" >> "$GITHUB_ENV"

      # Spring Boot 4 writes its native-image metadata in the format of GraalVM 25, so 25 it is (and not "latest").
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      # If a step fails, its error lines are also written as annotations (shown on the run page and readable through the API), because the
      # full log is awkward to get at from the command line.
      - name: Build the native executable
        shell: bash
        run: |
          set -o pipefail
          ./gradlew nativeCompile -PjavaVersion=25 --stacktrace 2>&1 | tee build.log || {
            grep -n -i -m 12 "error\|exception\|caused by\|failed\|different root" build.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }

      - name: Smoke-test the executable
        shell: bash
        run: |
          set -o pipefail
          scripts/smoke-test.sh "${{ matrix.binary }}" 2>&1 | tee smoke.log || {
            grep -n -i -m 15 "FAIL\|error\|exception\|stopped\|reply" smoke.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }

      - name: Name the file after its system and add a checksum
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          python -c "import hashlib,sys; p=sys.argv[1]; print(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p.split('/')[-1])" "dist/${{ matrix.asset }}" > "dist/${{ matrix.asset }}.sha256"
          ls -l dist

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
