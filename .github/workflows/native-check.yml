# Builds and smoke-tests the native executable on ONE system, on demand, without running the tests and without publishing anything.
# For trying a fix on Windows, macOS or Linux in a few minutes instead of running the whole release:
#   gh workflow run native-check.yml -f os=windows-latest        (also: macos-15, ubuntu-latest, ubuntu-24.04-arm)
# If it fails, the error lines are written as annotations on the run.
name: Native check

on:
  workflow_dispatch:
    inputs:
      os:
        description: The system to build on
        type: choice
        default: windows-latest
        options:
          - windows-latest
          - macos-15
          - ubuntu-latest
          - ubuntu-24.04-arm
      native_args:
        description: Extra GraalVM options for this build (for example -J-Xmx6500m -H:DeadlockWatchdogInterval=0)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    name: Native build on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Windows only: the GraalVM Gradle plugin writes native-image's argument file into Java's temp folder (on C: on the runner) and then
      # writes its path relative to the build folder (on D:), which fails with "'other' has different root" across two drives. So Java's
      # temp folder goes inside the workspace too, for every JVM of the build.
      - name: Keep Java's temp folder on the same drive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ws="$(cygpath -m "$GITHUB_WORKSPACE")"
          mkdir -p "$ws/tmp"
          echo "JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=$ws/tmp" >> "$GITHUB_ENV"

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the native executable
        shell: bash
        run: |
          set -o pipefail
          ./gradlew nativeCompile -PjavaVersion=25 "-PnativeExtraArgs=${{ inputs.native_args }}" --stacktrace 2>&1 | tee build.log || {
            grep -n -i -m 12 "error\|exception\|caused by\|failed\|different root" build.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }

      - name: Smoke-test the executable
        shell: bash
        run: |
          set -o pipefail
          bin=build/native/nativeCompile/FinancialDashboard
          [ -f "$bin.exe" ] && bin="$bin.exe"
          ls -l "$bin"
          scripts/smoke-test.sh "$bin" 2>&1 | tee smoke.log || {
            grep -n -i -m 15 "FAIL\|error\|exception\|stopped\|reply" smoke.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }
