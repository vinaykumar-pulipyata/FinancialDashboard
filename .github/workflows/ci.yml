# Continuous integration: every push and every pull request is built and tested on Linux, Windows and macOS (Apple silicon).
# `./gradlew build` runs the Java tests, then the JavaScript tests (task jsTest, Node's own runner), then builds the application jar.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# a newer push to the same branch cancels the run still going for the older one
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false          # one system failing should not hide how the others did
      matrix:
        # macos-15 is Apple silicon (arm64). The Intel macOS runners (macos-13, macos-15-intel) are left out on purpose.
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # The prerequisites the tests need: Java 17 (the build), Node 18+ (the JavaScript tests), Python 3 (DemoDataTest runs the demo-data script).
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle (with its cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Show the tools
        shell: bash
        run: |
          java -version
          node --version
          python --version
          ./gradlew --version

      - name: Build and test
        shell: bash
        run: ./gradlew build --stacktrace

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
            build/test-results/test
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the application jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: financial-dashboard-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
