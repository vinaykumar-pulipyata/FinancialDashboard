spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# Most tests let Hibernate build their throw-away database; FlywayMigrationTest and FlywayBaselineTest check the migrations.
spring.flyway.enabled=false
# Tests switch the automatic backups off and write any backup into a throw-away folder.
app.backup.automatic=false
app.backup.dir=${java.io.tmpdir}/financial-dashboard-test-backups
app.log.dir=${java.io.tmpdir}/financial-dashboard-test-logs
