spring.application.name=FinancialDashboard
server.port = 8080

# File-based H2: data survives restarts. Stored in ./data relative to the working directory.
spring.datasource.url=jdbc:h2:file:./data/financialdb
spring.datasource.username=sa
spring.datasource.password=
# The schema is built by Flyway (src/main/resources/db/migration, V1 is the baseline) and only checked by Hibernate:
# a change to an entity needs a new V<n>__*.sql file, or the app refuses to start and says which column is wrong.
# A database made before Flyway (it has tables but no history) is marked as version 1 and V1 is skipped.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# The HTML, CSS and JavaScript files are re-checked on every load, so a new version shows up after a restart
# without needing a hard refresh.
spring.web.resources.cache.cachecontrol.no-cache=true

# Login: one user (admin), HTTP Basic. The password is set in the app on first run and kept as a hash in the database.
# Forgot it? Start once with --reset-password. Only this machine can reach the app.
server.address=127.0.0.1
spring.h2.console.enabled=false

# Backups: a zipped SQL copy of the whole database, checked after it is written. See docs/SPEC.md section 4a.
# The folder is relative to where the app is started, like the database itself.
app.backup.dir=./backups
app.backup.automatic=true

# Logging: to the console and to ./logs/general/<year-month>/<date>.<n>.log (a new file each day or at 10 MB, 30 days / 300 MB kept;
# the layout is in logback-spring.xml). The proxy's log is in ./logs/caddy/<year-month>/<date>.log (written by scripts/financial-dashboard.sh). What is logged is ids, kinds
# and dates of changes, API calls (path and status only) and refused sign-ins; never amounts, note text or passwords.
# Set com.learning.spring.financialdashboard to DEBUG to also see every read request.
logging.level.root=INFO
logging.level.com.learning.spring.financialdashboard=INFO
app.log.dir=./logs/general
app.log.max-file-size=10MB
app.log.max-history=30
app.log.total-size-cap=300MB

# The name shown in the start-up message. Any *.localhost name reaches this computer without setup; the app answers to every name.
app.host=finance.localhost
