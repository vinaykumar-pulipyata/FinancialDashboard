<!-- FUTURE EXPENSES LEDGER: one dialog, reused by Fund Ledger, Add bucket, Edit, Pay, Transfer and Close -->
<div class="modal-overlay hidden" id="ledgerOverlay">
    <div class="modal txn-transfer ledger-modal">
        <div class="modal-header">
            <h2 id="ledgerTitle">Future Expenses Ledger</h2>
            <button class="modal-close" id="ledgerClose" title="Close">&#10005;</button>
        </div>
        <div class="modal-body txn-form" id="ledgerBody"></div>
        <div class="modal-footer">
            <span class="modal-error" id="ledgerError"></span>
            <button class="btn btn-secondary" id="ledgerCancel">Cancel</button>
            <button class="btn btn-primary" id="ledgerPrimary">OK</button>
        </div>
    </div>
</div>
