<!-- PASSWORD: set on first run (no close button, the dashboard stays hidden) or changed from the header -->
<div class="modal-overlay hidden" id="passwordOverlay">
    <div class="modal txn-transfer">
        <div class="modal-header">
            <h2 id="passwordTitle">Set a password</h2>
            <button class="modal-close hidden" id="passwordClose" title="Close">&#10005;</button>
        </div>
        <div class="modal-body txn-form">
            <div class="edit-hint" id="passwordHint"></div>
            <div class="txn-field hidden" id="passwordCurrentField"><span>Current password</span>
                <input type="password" id="passwordCurrent" autocomplete="current-password">
            </div>
            <div class="txn-field"><span>New password (at least 8 characters)</span>
                <input type="password" id="passwordNew" autocomplete="new-password">
            </div>
            <div class="txn-field"><span>Type it again</span>
                <input type="password" id="passwordRepeat" autocomplete="new-password">
            </div>
        </div>
        <div class="modal-footer">
            <span class="modal-error" id="passwordError"></span>
            <button class="btn btn-secondary hidden" id="passwordCancel">Cancel</button>
            <button class="btn btn-primary" id="passwordSave">Save</button>
        </div>
    </div>
</div>

<!-- SCREEN LOCK: covers the whole dashboard until the password is typed again -->
<div class="modal-overlay lock-screen hidden" id="lockOverlay">
    <div class="modal txn-transfer">
        <div class="modal-header"><h2>Screen locked</h2></div>
        <div class="modal-body txn-form">
            <div class="txn-field"><span>Enter your password to unlock</span>
                <input type="password" id="lockPassword" autocomplete="current-password">
            </div>
        </div>
        <div class="modal-footer">
            <span class="modal-error" id="lockError"></span>
            <button class="btn btn-primary" id="lockUnlock">Unlock</button>
        </div>
    </div>
</div>
