<!-- FIRST-TIME SETUP: welcome, account types, bank & cash, loans & credit, the rest, done -->
<div class="modal-overlay hidden" id="setupOverlay">
    <div class="modal wizard setup-wizard">
        <div class="modal-header">
            <h2>Set up your dashboard</h2>
            <button class="modal-close" id="setupClose" title="Close">&#10005;</button>
        </div>
        <div class="modal-body">
            <div class="wizard-steps" id="setupSteps"></div>
            <div id="setupContent"></div>
        </div>
        <div class="modal-footer">
            <button class="skip-link" id="setupSkip">Skip setup, I'll add accounts later</button>
            <span class="modal-error" id="setupError"></span>
            <button class="btn btn-secondary" id="setupBack">Back</button>
            <button class="btn btn-primary" id="setupNext">Next</button>
        </div>
    </div>
</div>
